# =====================================================================
# GhAccel — nginx 部署示例 (deploy/nginx.example.conf)
#
# 用法: 复制进 http{} 所在站点的 server{} 配置(宝塔在 "网站→设置→配置文件" 粘进 server 块),
#       再把 {FASTCGI_PASS} / server_name / root / 证书路径换成你自己的。
# 文档根必须指向 public/: 只有 index.php(与并行交付的 panel.php)暴露执行, src/ 与 var/ 都在其外。
#
# 运行前提(php.ini / 宝塔"PHP 设置→配置修改", 不在本文件里设):
#   zlib.output_compression = Off   # 开启会重新分块 -> Content-Length 与实际字节不符 -> Range/断点续传/sha256 三件事一起坏(selfCheck 会判 critical)
#   cgi.fix_pathinfo       = 0      # 关路径信息推断, 配合下面 SCRIPT_FILENAME 锁定
#   expose_php             = Off
# =====================================================================

# 上游 php-fpm: unix 套接字或 127.0.0.1:9000, 按本机实际填。
upstream ghaaccel_fpm {
    server unix:/tmp/php-cgi-81.sock;   # 宝塔常见: /tmp/php-cgi-<版本>.sock
    # keepalive 32;                     # 可选: 复用连接(注意本项目出站锁 IPv4, 与入站复用无关)
}

server {
    listen      443 ssl;
    http2       on;                       # 入站 HTTP/2 与"透传 HTTP/2 到上游"是两回事(后者推迟 v2)
    server_name gh.example.com;           # <- 换成你的域名

    # root 指向仓库的 public/ 目录(不是仓库根!)。宝塔里等价于把"运行目录"设为 /public。
    root        /www/wwwroot/ghaccel/public;
    index       index.php;

    # ---- 关键 1: 不折叠 URL 里的 // ----
    # 绝对形式入口是 /https://github.com/... 。merge_slashes 默认 on 会把它折叠成 /https:/,
    # 表面分发与 RefParser 就对不上 —— 一上 CDN/加速插件路由全灭就是这么来的。
    # 与"提供三种等价入口形式"互为兜底: 这里保住第 1 种, 第 2/3 种不依赖 //。
    merge_slashes off;

    # 只走 https; 80 端口另起一个 server 块 301 跳过来即可(略)。
    ssl_certificate     /www/server/panel/vhost/cert/gh.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/gh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 本站点是只读加速网关, 没有上传: 请求体上限压到很小即可(面板写接口是 JSON, 也不大)。
    client_max_body_size 8m;
    client_body_buffer_size 256k;

    # 大文件流式响应不能被 nginx 侧改写: 关掉这里的 gzip, 否则又造出"头说 gzip、体是明文/长度不符"。
    gzip off;

    # ---- 安全响应头(全站兜底; 首页/面板会按各自表面再下发更细的 CSP) ----
    add_header X-Content-Type-Options "nosniff"               always;
    add_header X-Frame-Options        "DENY"                  always;
    add_header Referrer-Policy        "no-referrer"           always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    server_tokens off;   # 关 nginx 版本指纹(等价 Apache 的 unset Server)

    # ---- 危险目录: 即便 root 已经在 public/, 仍显式 deny(纵深防御, 防止误把仓库根当 root) ----
    location ^~ /var/ { deny all; }        # 缓存/状态/会话/密钥的唯一可写落地点
    location ^~ /src/ { deny all; }
    location ^~ /config/ { deny all; }
    location ^~ /bin/   { deny all; }
    location ~ /\..*      { deny all; }     # .gitignore/.editorconfig/.git 等隐藏文件

    # ---- 前端控制器 ----
    # 表面互斥由 index.php 决定, nginx 只负责"除了真实静态文件, 一切交给 index.php"。
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 面板静态资源(并行交付落地后): 真实存在就直接给文件。
    location ^~ /panel/assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- PHP 执行: 只执行 index.php / panel.php ----
    # 关键 2: SCRIPT_FILENAME 锁死成 $document_root/index.php, 不从 $uri 推文件名。
    # 这是"var/cache 被写入 webshell 后还能不能被执行"的唯一硬防线 —— 它不依赖你记住每个
    # 新增子目录, 比逐目录 deny all 更可靠。配合 php.ini 的 cgi.fix_pathinfo=0。
    # 若面板交付后需要执行 panel.php, 在下面的 if 白名单里加 ^/panel\.php$; 其它一律 404。
    location ~ \.php$ {
        # 只放行入口脚本, 其余 .php 路径(含缓存目录里被塞进去的)直接 404。
        if ($request_uri !~ ^/(index|panel)\.php($|\?)) {
            return 404;
        }

        include        fastcgi_params;
        fastcgi_pass   ghaaccel_fpm;

        fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;   # 锁定, 见上
        fastcgi_param  DOCUMENT_ROOT    $document_root;
        fastcgi_param  SCRIPT_NAME      /index.php;
        # REQUEST_URI / QUERY_STRING 由 fastcgi_params 带入; 网关只信 REQUEST_URI 的原始串,
        # 不信 PATH_INFO(RefParser 从不用它)。

        # ---- 关键 3: 关缓冲, 否则破坏"边收边 flush"的零拷贝流式 ----
        # 开了缓冲, 大文件会在 nginx 磁盘上整块缓存, 首字节延迟暴涨、Range 语义与断点续传被打乱。
        fastcgi_buffering           off;
        fastcgi_max_temp_file_size  0;          # 不把响应临时落盘
        # 大 release 一次要下很久: 读超时给足(php 侧 LOW_SPEED_* 才是真正掐假活连接的机制)。
        fastcgi_read_timeout        900s;
        fastcgi_send_timeout        900s;
        fastcgi_connect_timeout     10s;

        # 断连感知: 客户端关连接后立刻中止回源, 别再替用户向下游拉几十 MB。
        fastcgi_ignore_client_abort off;
    }

    # 静态兜底(理论上 surface 已把非入口路径都拦走)。
    location ~* /\.(ht|git) { deny all; }
}
